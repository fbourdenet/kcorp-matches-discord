name: daily

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Début de la fenêtre de 24 h, ex. 2026-09-24T08:00:00+02:00"
        required: false

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm start
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LIQUIPEDIA_USER_AGENT: ${{ secrets.LIQUIPEDIA_USER_AGENT }}
          TARGET_DATE: ${{ inputs.target_date }}
